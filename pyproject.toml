[project]
name = "zoom-mcp"
version = "0.1.0"
description = "MCP server exposing zoom and image_info tools for inspecting fine detail in plot images"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jack Vojak" }]
dependencies = [
    "mcp>=2,<3",
    "pillow>=10.1",
]

[project.scripts]
zoom-mcp = "zoom_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoom_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
